# Backend switch — the one setting most people touch.
#   false → self-host the open Paritok model locally (via Ollama).
#   true  → use the Paritok GPU server (needs an API key from https://paritok.com).
use_gpu_server: false

# Paritok GPU server — only used when use_gpu_server: true.
gpu_server:
  base_url: https://www.paritok.com/api   # POST /compress, GET /test
  model: paritok-4b-v1
  api_key: ""            # paste your key, or set env PARITOK_API_KEY
  timeout: 90.0

# Self-hosted local model — only used when use_gpu_server: false.
local_model:
  base_url: http://localhost:11434/v1
  # ollama pull paritok/paritok-4b-v1 && ollama cp paritok/paritok-4b-v1 paritok-4b-v1
  model: paritok-4b-v1
  temperature: 0
  timeout: 300.0

compression:
  min_tokens: 512          # skip compression below this
  max_tokens: 50000        # skip compression above this
  refusal_threshold: 0.05  # must save at least 5% or keep the original

history:
  enabled: true
  keep_recent_turns: 4     # keep last N turns intact
  context_threshold: 0.8   # compress old turns when >80% of the window is used
  context_window: 200000

tool_discovery:
  strategy: embedding      # "embedding" (default) | "relevance" | "passthrough"
  top_k: 5                 # (relevance) keep top-K tool schemas, stub the rest
  # embedding strategy (semantic select + session freeze + adaptive apply):
  k_max: 8                 # max tools kept in full schema
  adaptive: true           # coding tasks drop unselected MCP; MCP tasks stub them
  mcp_signal_threshold: 1.0

# Per-compression debug trace. Turn on to log every original→compressed pair.
trace:
  enabled: false
  path: compress_trace.jsonl

# Codex CLI — Codex can't read OPENAI_BASE_URL, so flip this on and paritok will
# write ~/.codex/config.toml for you (backing up any existing one). Then just run
# `codex`. Everything lives here — no TOML to hand-edit.
codex:
  enabled: false           # true → route Codex through this proxy (writes ~/.codex/config.toml).
                           # Codex uses your OWN login (ChatGPT subscription or API key via
                           # `codex login`), like Claude Code — no key needed here. Add
                           # `model: <id>` only if you want to pin one (else Codex chooses).

shadow_storage: memory     # "memory" | "redis" (redis persists [REF] across restarts; needs paritok[redis])
